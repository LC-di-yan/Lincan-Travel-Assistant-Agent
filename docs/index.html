<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aligo · 演示入口</title>
<style>
:root{--paper:#f7f3ec;--raised:#fffdf8;--ink:#171a1f;--ink2:#4a4f57;--ink3:#62676f;
--rule:#d9d2c5;--accent:#b83c22;--route:#1f4e6b}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--paper);
color:var(--ink);font:14px/1.7 "PingFang SC","MiSans","Noto Sans SC",sans-serif}
.box{max-width:560px;padding:36px 28px;border:1px solid var(--rule);background:var(--raised)}
.logo{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:14px}
.mark{width:26px;height:26px;border:2px solid var(--accent);display:grid;place-items:center;
color:var(--accent);font-weight:700;font-size:13px}
h1{font-size:15px;letter-spacing:.16em;margin:0}
p{color:var(--ink2);font-size:13px}
.meta{font:10px/1 ui-monospace,monospace;letter-spacing:.12em;color:var(--ink3);margin-top:22px}
a.go{display:inline-block;margin-top:8px;background:var(--accent);color:#fff;text-decoration:none;
padding:11px 18px;font-size:13px;font-weight:600;transition:background .18s,transform .06s}
a.go:hover{background:#9e301a}
a.go:active{transform:scale(.98)}
a.alt{color:var(--route);text-decoration:none;border-bottom:1px solid currentColor}
.row{margin-top:20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><div class="mark">A</div><h1>ALIGO</h1></div>
  <p style="margin-top:16px">基于 AgentScope 2.0 的多智能体差旅助手：一句话生成可执行行程，
  并联动车票、天气、知识库、记账、汇率、翻译与偏好记忆。</p>
  <div class="meta">演示形式</div>
  <p style="margin:6px 0 0"><b>静态回放</b>（推荐）：7 组真实运行的交互录制，无需后端，永久可用。</p>
  <div class="row">
    <a class="go" href="demo/">打开演示</a>
    <a class="alt" href="https://github.com/LC-di-yan/Lincan-Travel-Assistant-Agent">查看源码</a>
  </div>
  <div class="meta" style="margin-top:26px">说明</div>
  <p style="margin:6px 0 0;font-size:12px;color:var(--ink3)">
  回放内容由项目真实调用大模型与技能产生；页面本身不联网、不含任何密钥。
  需要实时对话请按仓库 README 启动本地服务。</p>
</div>
</body>
</html>
