<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aligo · 静态演示</title>
<style>
:root{--paper:#f7f3ec;--raised:#fffdf8;--sunken:#efe9de;--ink:#171a1f;--ink2:#4a4f57;--ink3:#62676f;
--rule:#d9d2c5;--rule2:#8c8578;--accent:#b83c22;--tint:#f3e1d9;--ok:#2f6b4f;--route:#1f4e6b}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
font:14px/1.65 "PingFang SC","MiSans","Noto Sans SC","Microsoft YaHei",sans-serif;
-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 60px}
header{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:14px}
.logo{width:26px;height:26px;border:2px solid var(--accent);display:grid;place-items:center;
color:var(--accent);font-weight:700;font-size:13px}
h1{font-size:15px;letter-spacing:.16em;margin:0;font-weight:700}
.sub{font-size:11px;color:var(--ink3);letter-spacing:.06em}
.banner{margin:18px 0 0;padding:10px 12px;border:1px solid var(--rule);background:var(--raised);
font-size:12px;color:var(--ink2)}
.banner b{color:var(--accent)}
.grid{display:grid;grid-template-columns:220px 1fr;gap:22px;margin-top:22px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.scene{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);
background:none;padding:10px 2px;cursor:pointer;color:var(--ink2);font:inherit;
transition:color .18s,transform .06s}
.scene:hover{color:var(--ink)}
.scene:active{transform:scale(.985)}
.scene[aria-current="true"]{color:var(--accent);font-weight:600}
.scene .k{font:10px/1 ui-monospace,monospace;letter-spacing:.12em;color:var(--ink3);display:block;margin-bottom:4px}
.scene[aria-current="true"] .k{color:var(--accent)}
.stage{min-height:420px}
.bubble{max-width:70%;margin:0 0 0 auto;background:var(--sunken);border:1px solid var(--rule);
padding:10px 12px;font-size:13px}
.meta{display:flex;justify-content:space-between;font:10px/1 ui-monospace,monospace;
letter-spacing:.08em;color:var(--ink3);margin:16px 0 8px}
.answer{white-space:pre-wrap;color:var(--ink2);font-size:13px;min-height:1.5em}
.card{border:1px solid var(--rule);background:var(--raised);margin-top:14px}
.card>.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
border-bottom:1px solid var(--rule);padding:10px 14px}
.eyebrow{font:10px/1 ui-monospace,monospace;letter-spacing:.14em;color:var(--accent)}
.title{font-size:13px;font-weight:600;margin-top:5px}
.badge{border:1px solid var(--ok);color:var(--ok);font:10px/1 ui-monospace,monospace;padding:4px 7px}
.card>.bd{padding:12px 14px;font-size:13px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--rule)}
th{color:var(--ink3);font-weight:500;font:10px/1.4 ui-monospace,monospace;letter-spacing:.06em}
td.n{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;text-align:right}
.chip{display:inline-block;border:1px solid var(--rule2);color:var(--ink3);
font:10px/1 ui-monospace,monospace;padding:3px 6px;margin-right:6px}
.chip.a{border-color:var(--accent);color:var(--accent)}
.big{font:600 26px/1.2 ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--accent)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.muted{color:var(--ink3);font-size:11px}
.list{border-top:1px solid var(--rule)}
.list div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:12px}
.dots{color:var(--accent);letter-spacing:.2em}
footer{margin-top:36px;border-top:1px solid var(--rule);padding-top:14px;font-size:11px;color:var(--ink3)}
footer a{color:var(--route)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="logo">A</div>
<h1>ALIGO</h1>
<span class="sub">静态演示 · 真实数据回放</span>
</header>
<div class="banner">
这是<b>真实运行录制</b>的交互回放：每条回答都由项目实际调用大模型与技能产生，
录制后以静态数据保存。页面本身不含任何密钥，也不需要后端即可浏览。
需要实时对话请用仓库 README 中的在线实例。
</div>
<div class="grid">
<nav id="scenes" aria-label="演示场景"></nav>
<section class="stage" id="stage">
<div class="bubble" id="q">选择一个场景</div>
<div class="meta"><span id="mt">ALIGO / DEMO</span><span id="ms"></span></div>
<div class="answer" id="ans"></div>
<div id="card"></div>
</section>
</div>
<footer>
数据录制于项目真实运行 · <a href="../">返回仓库说明</a> · 
界面与主站一致（暖纸墨色 / 等宽数字 / 线性图标）
</footer>
</div>
<script src="app.js"></script>
</body>
</html>
