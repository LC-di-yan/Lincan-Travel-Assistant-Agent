  <!-- West Lake wave hint -->
  <path d="M20 98 Q50 92 80 98 Q110 104 140 98 Q170 92 195 98" stroke="#4f8ef7" stroke-width="1" fill="none" opacity="0.08" />

  <line x1="20" y1="95" x2="185" y2="95" stroke="#4f8ef7" stroke-width="1" opacity="0.08" />
</svg>
