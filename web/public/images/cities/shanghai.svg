<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- Shanghai: Oriental Pearl Tower + skyline -->
  <g opacity="0.12" fill="#4f8ef7">
    <!-- Oriental Pearl Tower -->
    <rect x="56" y="30" width="8" height="65" rx="2" />
    <circle cx="60" cy="50" r="14" />
    <circle cx="60" cy="50" r="8" fill="white" opacity="0.3" />
    <circle cx="60" cy="78" r="10" />
    <circle cx="60" cy="78" r="5" fill="white" opacity="0.3" />
    <rect x="58" y="15" width="4" height="18" rx="1" />
    <line x1="60" y1="10" x2="60" y2="15" stroke="#4f8ef7" stroke-width="2" />

    <!-- Shanghai Tower -->
    <path d="M100 95 L105 30 Q108 25 110 30 L115 95" fill="#4f8ef7" opacity="0.8" />

    <!-- Shanghai World Financial Center (bottle opener) -->
    <rect x="125" y="35" width="14" height="60" rx="2" />
    <rect x="128" y="30" width="8" height="10" rx="4" fill="white" opacity="0.3" />

    <!-- Jin Mao Tower -->
    <rect x="148" y="42" width="12" height="53" rx="2" />
    <path d="M148 42 L154 30 L160 42" fill="#4f8ef7" opacity="0.8" />

    <!-- Background buildings -->
    <rect x="170" y="55" width="10" height="40" rx="1" opacity="0.6" />
    <rect x="82" y="60" width="8" height="35" rx="1" opacity="0.5" />
  </g>
  <line x1="30" y1="95" x2="185" y2="95" stroke="#4f8ef7" stroke-width="1" opacity="0.08" />
</svg>
