<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <defs>
    <linearGradient id="wh-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0fe" />
      <stop offset="100%" stop-color="#f0f4ff" />
    </linearGradient>
    <linearGradient id="wh-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8ef7" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="wh-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="wh-ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8f0fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#4f8ef7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#e8f0fe" stop-opacity="0" />
    </linearGradient>
    <filter id="wh-glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="320" fill="url(#wh-sky)" rx="20" />

  <!-- Subtle grid -->
  <g opacity="0.08" stroke="#4f8ef7" stroke-width="0.5">
    <line x1="0" y1="40" x2="480" y2="40"/><line x1="0" y1="80" x2="480" y2="80"/>
    <line x1="0" y1="120" x2="480" y2="120"/><line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="0" y1="200" x2="480" y2="200"/><line x1="0" y1="240" x2="480" y2="240"/>
    <line x1="0" y1="280" x2="480" y2="280"/>
    <line x1="40" y1="0" x2="40" y2="320"/><line x1="80" y1="0" x2="80" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/><line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="280" y1="0" x2="280" y2="320"/><line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="360" y1="0" x2="360" y2="320"/><line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="440" y1="0" x2="440" y2="320"/>
  </g>

  <!-- Globe -->
  <circle cx="240" cy="145" r="65" stroke="url(#wh-accent)" stroke-width="1.5" fill="none" opacity="0.2" />
  <ellipse cx="240" cy="145" rx="65" ry="25" stroke="url(#wh-accent)" stroke-width="1" fill="none" opacity="0.15" />
  <ellipse cx="240" cy="145" rx="25" ry="65" stroke="url(#wh-accent)" stroke-width="1" fill="none" opacity="0.15" />
  <line x1="175" y1="145" x2="305" y2="145" stroke="url(#wh-accent)" stroke-width="0.8" opacity="0.12" />
  <ellipse cx="240" cy="145" rx="45" ry="65" stroke="url(#wh-accent)" stroke-width="0.5" fill="none" opacity="0.1" />

  <!-- Orbiting ring -->
  <ellipse cx="240" cy="145" rx="85" ry="30" stroke="url(#wh-accent)" stroke-width="1" fill="none" opacity="0.12" stroke-dasharray="4 6" />

  <!-- Flight path 1: Beijing to Shanghai -->
  <path d="M155 115 Q200 75 260 100" stroke="url(#wh-accent)" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite" />
  </path>
  <!-- Airplane 1 -->
  <g transform="translate(215, 85) rotate(15)" filter="url(#wh-glow)">
    <path d="M0 0 L20 -7 L20 -3.5 L7 -1.5 L7 1.5 L20 3.5 L20 7 Z" fill="url(#wh-accent)" opacity="0.9" />
    <path d="M7 -1.5 L3 -9 L5 -7.5 L7 -3.5 Z" fill="url(#wh-accent)" opacity="0.7" />
    <path d="M7 1.5 L3 9 L5 7.5 L7 3.5 Z" fill="url(#wh-accent)" opacity="0.7" />
  </g>

  <!-- Flight path 2: curved arc -->
  <path d="M130 140 Q190 180 280 155 Q340 140 370 120" stroke="url(#wh-gold)" stroke-width="1.5" stroke-dasharray="4 6" fill="none" opacity="0.35">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="3s" repeatCount="indefinite" />
  </path>
  <!-- Airplane 2 (smaller) -->
  <g transform="translate(310, 142) rotate(-10)" opacity="0.6">
    <path d="M0 0 L14 -5 L14 -2.5 L5 -1 L5 1 L14 2.5 L14 5 Z" fill="url(#wh-gold)" />
  </g>

  <!-- Clouds -->
  <g opacity="0.4">
    <ellipse cx="90" cy="75" rx="30" ry="14" fill="white" />
    <ellipse cx="78" cy="70" rx="18" ry="12" fill="white" />
    <ellipse cx="108" cy="72" rx="15" ry="10" fill="white" />
  </g>
  <g opacity="0.3">
    <ellipse cx="380" cy="90" rx="25" ry="12" fill="white" />
    <ellipse cx="368" cy="86" rx="16" ry="10" fill="white" />
    <ellipse cx="396" cy="88" rx="14" ry="9" fill="white" />
  </g>
  <g opacity="0.2">
    <ellipse cx="320" cy="55" rx="20" ry="10" fill="white" />
    <ellipse cx="310" cy="52" rx="14" ry="8" fill="white" />
  </g>

  <!-- Location pins -->
  <g opacity="0.7">
    <g transform="translate(160, 165)">
      <path d="M0 0 C0 -12 -9 -20 -9 -27 C-9 -31.9 -4.9 -36 0 -36 C4.9 -36 9 -31.9 9 -27 C9 -20 0 -12 0 -0Z" fill="#4f8ef7" />
      <circle cx="0" cy="-27" r="3.5" fill="white" />
    </g>
    <g transform="translate(320, 160)">
      <path d="M0 0 C0 -12 -9 -20 -9 -27 C-9 -31.9 -4.9 -36 0 -36 C4.9 -36 9 -31.9 9 -27 C9 -20 0 -12 0 -0Z" fill="#8b5cf6" />
      <circle cx="0" cy="-27" r="3.5" fill="white" />
    </g>
  </g>

  <!-- City skyline left -->
  <g opacity="0.12" fill="#4f8ef7">
    <rect x="45" y="230" width="20" height="50" rx="2" />
    <rect x="68" y="215" width="16" height="65" rx="2" />
    <rect x="87" y="235" width="22" height="45" rx="2" />
    <rect x="112" y="220" width="14" height="60" rx="2" />
    <rect x="129" y="240" width="18" height="40" rx="2" />
  </g>

  <!-- City skyline right -->
  <g opacity="0.12" fill="#8b5cf6">
    <rect x="335" y="225" width="18" height="55" rx="2" />
    <rect x="356" y="210" width="22" height="70" rx="2" />
    <rect x="381" y="230" width="16" height="50" rx="2" />
    <rect x="400" y="218" width="20" height="62" rx="2" />
    <rect x="423" y="235" width="14" height="45" rx="2" />
  </g>

  <!-- Ground -->
  <path d="M0 275 Q240 265 480 275" stroke="url(#wh-accent)" stroke-width="1.5" fill="none" opacity="0.15" />
  <rect x="0" y="275" width="480" height="45" fill="url(#wh-ground)" />

  <!-- Decorative dots -->
  <g opacity="0.25" fill="#4f8ef7">
    <circle cx="60" cy="50" r="2" /><circle cx="420" cy="60" r="1.5" />
    <circle cx="150" cy="40" r="1.5" /><circle cx="350" cy="45" r="2" />
    <circle cx="50" cy="160" r="1" /><circle cx="430" cy="170" r="1.5" />
  </g>

  <!-- Sparkles -->
  <g opacity="0.4" fill="url(#wh-gold)">
    <circle cx="200" cy="105" r="2">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="280" cy="95" r="1.5">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="240" cy="70" r="1.8">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="1.8s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
