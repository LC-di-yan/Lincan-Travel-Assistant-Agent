<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <defs>
    <linearGradient id="nh-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8ef7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.08" />
    </linearGradient>
  </defs>
  <rect width="160" height="120" fill="url(#nh-accent)" rx="10" />
  <!-- Map outline -->
  <rect x="30" y="25" width="100" height="70" rx="6" stroke="#4f8ef7" stroke-width="1.5" fill="none" opacity="0.2" />
  <!-- Folded corner -->
  <path d="M110 25 L130 25 L130 45 Z" fill="#4f8ef7" opacity="0.08" stroke="#4f8ef7" stroke-width="1" stroke-opacity="0.2" />
  <!-- Dashed route -->
  <path d="M50 55 Q80 40 110 60" stroke="#4f8ef7" stroke-width="1.5" stroke-dasharray="4 3" fill="none" opacity="0.25" />
  <!-- Location pin (faded) -->
  <g transform="translate(80, 55)" opacity="0.25">
    <path d="M0 0 C0 -8 -6 -14 -6 -19 C-6 -22.3 -3.3 -25 0 -25 C3.3 -25 6 -22.3 6 -19 C6 -14 0 -8 0 -0Z" fill="#4f8ef7" />
    <circle cx="0" cy="-19" r="2.5" fill="white" />
  </g>
  <!-- "No data" lines -->
  <line x1="55" y1="80" x2="105" y2="80" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.15" />
  <line x1="65" y1="88" x2="95" y2="88" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" opacity="0.1" />
</svg>
