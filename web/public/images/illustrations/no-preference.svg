<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <defs>
    <linearGradient id="np-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.06" />
    </linearGradient>
  </defs>
  <rect width="160" height="120" fill="url(#np-accent)" rx="10" />
  <!-- Suitcase -->
  <rect x="50" y="40" width="60" height="45" rx="8" stroke="#ec4899" stroke-width="1.5" fill="none" opacity="0.25" />
  <!-- Handle -->
  <path d="M68 40 L68 32 Q68 26 74 26 L86 26 Q92 26 92 32 L92 40" stroke="#ec4899" stroke-width="1.5" fill="none" opacity="0.25" />
