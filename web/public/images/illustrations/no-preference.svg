    <path d="M0 -3 C-1 -6 -5 -7 -7 -5 C-9 -3 -9 1 0 6 C9 1 9 -3 7 -5 C5 -7 1 -6 0 -3Z" fill="#ec4899" />
  </g>
  <!-- Tag -->
