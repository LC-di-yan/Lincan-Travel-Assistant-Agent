<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ht-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
  </defs>
  <!-- Building -->
  <rect x="12" y="18" width="40" height="40" rx="3" stroke="url(#ht-accent)" stroke-width="2" fill="none" opacity="0.3" />
  <!-- Windows -->
  <g fill="#8b5cf6" opacity="0.2">
    <rect x="18" y="24" width="6" height="6" rx="1" />
    <rect x="29" y="24" width="6" height="6" rx="1" />
    <rect x="40" y="24" width="6" height="6" rx="1" />
    <rect x="18" y="35" width="6" height="6" rx="1" />
    <rect x="29" y="35" width="6" height="6" rx="1" />
    <rect x="40" y="35" width="6" height="6" rx="1" />
  </g>
  <!-- Door -->
  <rect x="27" y="46" width="10" height="12" rx="2" stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.3" />
  <!-- Roof flag -->
  <line x1="32" y1="18" x2="32" y2="10" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3" />
  <path d="M32 10 L40 13 L32 16" fill="#8b5cf6" opacity="0.2" />
  <!-- Star (hotel rating) -->
  <g transform="translate(32, 8)" opacity="0.25" fill="#f59e0b">
    <path d="M0 -4 L1.2 -1.2 L4.5 -1.2 L2 -0.5 L3 2 L0 0.8 L-3 2 L-2 -0.5 L-4.5 -1.2 L-1.2 -1.2 Z" />
  </g>
</svg>
