<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mt-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  <!-- Table -->
  <rect x="10" y="36" width="44" height="4" rx="2" stroke="url(#mt-accent)" stroke-width="1.5" fill="none" opacity="0.3" />
  <!-- Table legs -->
  <line x1="16" y1="40" x2="16" y2="52" stroke="#10b981" stroke-width="1.5" opacity="0.2" />
  <line x1="48" y1="40" x2="48" y2="52" stroke="#10b981" stroke-width="1.5" opacity="0.2" />
  <!-- People (simplified) -->
  <!-- Person 1 -->
  <circle cx="20" cy="22" r="5" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.3" />
  <line x1="20" y1="27" x2="20" y2="36" stroke="#10b981" stroke-width="1.5" opacity="0.2" />
  <!-- Person 2 -->
  <circle cx="32" cy="20" r="5" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.3" />
  <line x1="32" y1="25" x2="32" y2="36" stroke="#10b981" stroke-width="1.5" opacity="0.2" />
  <!-- Person 3 -->
  <circle cx="44" cy="22" r="5" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.3" />
  <line x1="44" y1="27" x2="44" y2="36" stroke="#10b981" stroke-width="1.5" opacity="0.2" />
  <!-- Document on table -->
  <rect x="26" y="30" width="12" height="6" rx="1" fill="#10b981" opacity="0.12" />
  <!-- Presentation screen hint -->
  <rect x="22" y="8" width="20" height="10" rx="2" stroke="#10b981" stroke-width="1" fill="none" opacity="0.15" />
</svg>
