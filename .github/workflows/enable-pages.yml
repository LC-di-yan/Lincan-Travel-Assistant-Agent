name: Enable Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or update Pages site
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          OUT=''
          if gh api "repos/$REPO/pages" >/dev/null 2>&1; then
            OUT=$(gh api -X PUT "repos/$REPO/pages" -f 'source[branch]=gh-pages' -f 'source[path]=/' 2>&1)
            RC=$?
            ACTION=update
          else
            OUT=$(gh api -X POST "repos/$REPO/pages" -f 'source[branch]=gh-pages' -f 'source[path]=/' 2>&1)
            RC=$?
            ACTION=create
          fi
          {
            echo 'pages_rc='$RC
            echo 'pages_action='$ACTION
            echo 'pages_url=https://${{ github.repository_owner }}.github.io/$(basename $REPO)/'
            echo '--- api output ---'
            echo "$OUT" | head -c 800
          } > pages-status.txt
          cat pages-status.txt

      - name: Report result back to repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f pages-status.txt ]; then echo 'workflow ran but no status file' > pages-status.txt; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pages-status.txt
          git commit -m 'ci: pages status [skip ci]' || echo 'nothing to commit'
          git push || echo 'push failed'
